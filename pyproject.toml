[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz2-iptm-binder-calibration"
version = "1.2.1"
description = "Reproducibility materials for target-held-out Boltz-2 ipTM calibration and binder-design decision analysis"
requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
  "numpy==2.3.5",
  "pandas==3.0.1",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "openpyxl==3.1.5",
  "Pillow==13.0.0",
  "pypdf==6.10.0",
  "python-docx==1.2.0",
  "pypandoc>=1.15",
]

[tool.setuptools]
py-modules = []
