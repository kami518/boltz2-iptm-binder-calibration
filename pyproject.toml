[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz2-iptm-binder-calibration"
version = "1.2.0"
description = "Reproducibility materials for Boltz-2 ipTM calibration, target-held-out validation, and experimental decision analysis"
requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scipy==1.18.1",
  "scikit-learn==1.9.0",
  "matplotlib==3.10.9",
  "duckdb==1.5.3",
  "openpyxl==3.1.5",
  "Pillow>=10.0",
  "reportlab==4.4.9",
  "pypdf==6.10.0",
]

[tool.setuptools]
py-modules = []
